<!DOCTYPE html>
<html lang="es">
  <head>
    <script src="/_config.js"></script>

    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Sistema para la gestión de procesos de aseguramineto de la calidad, para registros y acreditaciones"
    />
    <link rel="apple-touch-icon" href="/images/logos/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Acredo</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <style>
        .loader {
          width: 200px;
          height: 5px;
          display: inline-block;
          background: rgba(0, 0, 0, 0.15);
          position: relative;
          overflow: hidden;
        }

        .loader::after {
          content: '';
          width: 0%;
          height: 5px;
          background-color: #FFF;
          font-size: 15px;
          background-image: linear-gradient(45deg, rgba(0, 0, 0, 0.25) 25%, transparent 25%, transparent 50%, rgba(0, 0, 0, 0.25) 50%, rgba(0, 0, 0, 0.25) 75%, transparent 75%, transparent);
          background-size: 1em 1em;
          position: absolute;
          top: 0;
          left: 0;
          box-sizing: border-box;
          animation: animFw 10s ease-in infinite, barStripe 1s linear infinite;
        }

        @keyframes barStripe {
          0% { background-position: 1em 0; }
          100% { background-position: 0 0; }
        }

        @keyframes animFw {
          0% { width: 0; }
          100% { width: 100%; }
        }
      </style>
      <div style="display:flex; justify-content: center; align-items: center; min-height: 95vh; flex-direction: column;">
        <div>
          <img src="/images/logos/logo192.png" height="80px" alt="Acredo" />
        </div>
        <div>
          <span class="loader"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
