<!-- Acredo logomark — dark version (use on light backgrounds) -->
<!-- File: logo-dark.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 64" fill="none" width="56" height="64" role="img" aria-label="Acredo logomark">
  <title>Acredo</title>
  <!-- Triangle body -->
  <path d="M28 6 L52 58 L4 58 Z" stroke="#1E3A5F" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Crossbar -->
  <line x1="16" y1="41" x2="40" y2="41" stroke="#1E3A5F" stroke-width="2.4"/>
  <!-- Arc (certification seal) -->
  <path d="M12 9 A20 20 0 0 1 44 9" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  <!-- Apex dot -->
  <circle cx="28" cy="6" r="3.2" fill="#10B981"/>
</svg>
